[workspace]
authors = ["Stijn Hofhuis <stijn.p.hofhuis@uit.no>", "Francesco Frassinelli <francesco.frassinelli@nina.no>"]
channels = ["conda-forge"]
name = "red_fox_tracks"
platforms = ["linux-64"]
version = "1.0.0"

[tasks]
shiny = "R -e 'shiny::runApp(\".\", port = 3838, host = \"0.0.0.0\")'"

[dependencies]
"r-data.table" = ">=1.18.6.1,<2"
r-httr = ">=1.4.9,<2"
r-jsonlite = ">=2.0.0,<3"
r-leaflet = ">=2.2.3,<3"
r-lubridate = ">=1.9.5,<2"
r-reprex = ">=2.1.1,<3"
r-shiny = ">=1.14.0,<2"
r-tidyverse = ">=2.0.0,<3"
