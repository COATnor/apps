[workspace]
authors = ["Hanna Bohner <hanna.bohner@uit.no>", "Francesco Frassinelli <francesco.frassinelli@nina.no>"]
channels = ["conda-forge"]
name = "small_rodents_abundance"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
shiny = "R -e 'shiny::runApp(\".\", port = 3838, host = \"0.0.0.0\")'"
setup = "R -e 'install.packages(\"ckanr\", repos = \"https://cloud.r-project.org\")'"

[dependencies]
r-shiny = ">=1.14.0,<2"
r-sciplot = ">=1.2_0,<2"
r-plotrix = ">=3.8_14,<4"
r-purrr = ">=1.2.2,<2"
# ckanr
r-remotes = "*"
r-dbi = ">=1.3.0,<2"
r-crul = ">=1.6.0,<2"
r-jsonlite = ">=2.0.0,<3"
r-dplyr = ">=1.2.1,<2"
r-dbplyr = ">=2.6.0,<3"
r-magrittr = ">=2.0.5,<3"
